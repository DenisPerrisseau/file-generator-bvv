databaseChangeLog:
  - changeSet:
      id: 1-create-templates-table
      author: system
      changes:
        - createTable:
            tableName: templates
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: prefix
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: nomenclature
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: file_path
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 2-create-template-fields-table
      author: system
      changes:
        - createTable:
            tableName: template_fields
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: template_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_template_fields_template
                    references: templates(id)
              - column:
                  name: field_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: field_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: required
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: min_length
                  type: INT
              - column:
                  name: max_length
                  type: INT
              - column:
                  name: min_value
                  type: DECIMAL(19,2)
              - column:
                  name: max_value
                  type: DECIMAL(19,2)
              - column:
                  name: date_format
                  type: VARCHAR(50)
              - column:
                  name: possible_values
                  type: TEXT
              - column:
                  name: error_injection_strategy
                  type: VARCHAR(255)
              - column:
                  name: field_position
                  type: INT

  - changeSet:
      id: 3-create-generation-jobs-table
      author: system
      changes:
        - createTable:
            tableName: generation_jobs
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: template_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_generation_jobs_template
                    references: templates(id)
              - column:
                  name: total_lines
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: error_lines
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: output_format
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: file_path
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: completed_at
                  type: TIMESTAMP

  - changeSet:
      id: 4-create-generation-logs-table
      author: system
      changes:
        - createTable:
            tableName: generation_logs
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: job_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_generation_logs_job
                    references: generation_jobs(id)
              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: http_status
                  type: INT
              - column:
                  name: response_message
                  type: TEXT
              - column:
                  name: sent_at
                  type: TIMESTAMP
              - column:
                  name: retry_count
                  type: INT
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: 5-create-indexes
      author: system
      changes:
        - createIndex:
            indexName: idx_templates_name
            tableName: templates
            columns:
              - column:
                  name: name
        - createIndex:
            indexName: idx_templates_nomenclature
            tableName: templates
            columns:
              - column:
                  name: nomenclature
        - createIndex:
            indexName: idx_generation_jobs_status
            tableName: generation_jobs
            columns:
              - column:
                  name: status
        - createIndex:
            indexName: idx_generation_logs_job_id
            tableName: generation_logs
            columns:
              - column:
                  name: job_id

  - changeSet:
      id: 6-create-target-urls-table
      author: system
      changes:
        - createTable:
            tableName: target_urls
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: VARCHAR(1000)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: 7-add-new-fields-to-generation-jobs
      author: system
      changes:
        - addColumn:
            tableName: generation_jobs
            columns:
              - column:
                  name: duplicate_lines
                  type: INT
                  defaultValue: 0
              - column:
                  name: selected_error_types
                  type: VARCHAR(500)

  - changeSet:
      id: 8-insert-sample-target-urls
      author: system
      changes:
        - insert:
            tableName: target_urls
            columns:
              - column:
                  name: name
                  value: "Serveur Local"
              - column:
                  name: url
                  value: "http://localhost:8081/api/ingestion"
              - column:
                  name: description
                  value: "Serveur de développement local"
        - insert:
            tableName: target_urls
            columns:
              - column:
                  name: name
                  value: "Serveur Test"
              - column:
                  name: url
                  value: "https://api-test.example.com/ingestion"
              - column:
                  name: description
                  value: "Environnement de test"
        - insert:
            tableName: target_urls
            columns:
              - column:
                  name: name
                  value: "Serveur Production"
              - column:
                  name: url
                  value: "https://api.example.com/ingestion"
              - column:
                  name: description
                  value: "Environnement de production"

  - changeSet:
      id: 9-add-bearer-token-to-target-urls
      author: system
      changes:
        - addColumn:
            tableName: target_urls
            columns:
              - column:
                  name: bearer_token
                  type: VARCHAR(1000)
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true

  - changeSet:
      id: 10-add-test-comparison-fields-to-jobs
      author: system
      changes:
        - addColumn:
            tableName: generation_jobs
            columns:
              - column:
                  name: target_url_id
                  type: BIGINT
              - column:
                  name: expected_lines_treated
                  type: INT
              - column:
                  name: expected_lines_insert
                  type: INT
              - column:
                  name: expected_lines_update
                  type: INT
              - column:
                  name: expected_lines_ignored
                  type: INT
              - column:
                  name: expected_http_status
                  type: INT
        - addForeignKeyConstraint:
            baseTableName: generation_jobs
            baseColumnNames: target_url_id
            constraintName: fk_job_target_url
            referencedTableName: target_urls
            referencedColumnNames: id
            onDelete: SET NULL

  - changeSet:
      id: 11-add-response-fields-to-logs
      author: system
      changes:
        - addColumn:
            tableName: generation_logs
            columns:
              - column:
                  name: actual_lines_treated
                  type: INT
              - column:
                  name: actual_lines_insert
                  type: INT
              - column:
                  name: actual_lines_update
                  type: INT
              - column:
                  name: actual_lines_ignored
                  type: INT
              - column:
                  name: response_status
                  type: VARCHAR(20)

